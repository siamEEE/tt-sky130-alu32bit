# Tiny Tapeout project information

project:
  title:        "32-bit 8-Operation ALU"
  author:       "Juhaer Mahtab Siam, Fahim Islam"
  discord:      "jm_siam_60612"
  description:  "A 32-bit arithmetic and logic unit with eight operations and a byte-oriented Tiny Tapeout interface"
  language:     "Verilog"
  clock_hz:     50000000

  # One SKY130 Tiny Tapeout tile
  tiles: "1x1"

  # Tiny Tapeout top-level module
  top_module: "tt_um_siameee_alu"

  # RTL source files
  source_files:
    - "project.v"
    - "alu_core.v"

# Pinout
pinout:

  # Dedicated 8-bit input data bus
  ui[0]: "data_in[0]"
  ui[1]: "data_in[1]"
  ui[2]: "data_in[2]"
  ui[3]: "data_in[3]"
  ui[4]: "data_in[4]"
  ui[5]: "data_in[5]"
  ui[6]: "data_in[6]"
  ui[7]: "data_in[7]"

  # Dedicated 8-bit result output bus
  uo[0]: "result[0]"
  uo[1]: "result[1]"
  uo[2]: "result[2]"
  uo[3]: "result[3]"
  uo[4]: "result[4]"
  uo[5]: "result[5]"
  uo[6]: "result[6]"
  uo[7]: "result[7]"

  # Bidirectional pins are used only as control inputs
  uio[0]: "command[0]"
  uio[1]: "command[1]"
  uio[2]: "command[2]"
  uio[3]: "byte_select[0]"
  uio[4]: "byte_select[1]"
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change
yaml_version: 6